# ==============================================================================
# kube-prometheus-stack Helm values for MSA AIOps Benchmark
# ==============================================================================

# 1. Grafana는 리소스(메모리/CPU) 절약을 위해 기본 비활성화 (필요시 활성화)
grafana:
  enabled: false

# 2. Alertmanager 설정
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace', 'service', 'pod']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 12h
      receiver: 'holmesgpt-webhook'
      routes:
        # onlineboutique 네임스페이스의 알람을 우선적으로 holmes로 전달
        - matchers:
            - namespace = "onlineboutique"
          receiver: 'holmesgpt-webhook'
          continue: true
    receivers:
      - name: 'holmesgpt-webhook'
        webhook_configs:
          - url: 'http://holmes-holmes.monitoring.svc.cluster.local:80/api/alertmanager'
            send_resolved: false
            max_alerts: 5

# 3. Prometheus 서버 리소스 최적화
prometheus:
  enabled: true
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1024Mi

# 4. Kube State Metrics 및 노드 익스포터
kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

