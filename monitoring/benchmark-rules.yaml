apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: benchmark-fast-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: benchmark.microservices.rules
      rules:
        # ======================================================================
        # [Google SRE Tier 1] 증상 기반 알람 (Symptom / SLO)
        # ======================================================================

        # [Case 05] E2E 주문 지연 (Google SRE Latency 증상 알람)
        - alert: OrderResponseSlow
          expr: (sum(increase(order_probe_duration_seconds_count{outcome="success"}[1m])) >= 3) and (sum(increase(order_probe_duration_seconds_bucket{outcome="success",le="0.9"}[1m])) / sum(increase(order_probe_duration_seconds_count{outcome="success"}[1m])) < 0.2)
          for: 15s
          labels:
            severity: warning
            namespace: onlineboutique
            service: frontend
            flow: checkout
            endpoint: /cart/checkout
          annotations:
            summary: "Observed order response latency is high at frontend entrypoint"
            description: "Fewer than 20% of observed successful checkout requests completed within 0.9s at frontend. Check distributed traces from frontend to downstream services to identify bottlenecks."

        # E2E 주문 실패율 급증 (Google SRE Errors 증상 알람)
        - alert: OrderFailureRateHigh
          expr: (sum(increase(order_probe_duration_seconds_count{outcome="failure"}[1m])) / sum(increase(order_probe_duration_seconds_count[1m])) > 0.10) and (sum(increase(order_probe_duration_seconds_count[1m])) >= 3)
          for: 15s
          labels:
            severity: critical
            namespace: onlineboutique
            service: frontend
            flow: checkout
            endpoint: /cart/checkout
          annotations:
            summary: "Order checkout failure rate exceeds 10% at frontend entrypoint."
            description: "Over 10% of observed order attempts failed in the last minute. Inspect frontend logs and downstream service traces."

        # ======================================================================
        # [Google SRE Tier 2] 원인 / 포화도 기반 알람 (Cause / Saturation)
        # ======================================================================

        # [Case 01] 레플리카 0 / 서비스 다운 (cartservice scale=0 대응)
        - alert: ServiceDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="onlineboutique"} == 0
          for: 15s
          labels:
            severity: critical
            namespace: onlineboutique
          annotations:
            summary: "Service deployment {{ $labels.deployment }} has 0 available replicas."
            description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has no running pods available."

        # [Case 02] CPU 과부하 / CPU Stress (파드 개별 CPU 한도 대비 80% 초과 또는 Throttling 발생 감지)
        - alert: ServiceHighCpuUsage
          expr: (sum by (pod, namespace) (rate(container_cpu_usage_seconds_total{namespace="onlineboutique", container!=""}[1m])) / sum by (pod, namespace) (kube_pod_container_resource_limits{namespace="onlineboutique", resource="cpu"}) > 0.80) or (sum by (pod, namespace) (rate(container_cpu_cfs_throttled_seconds_total{namespace="onlineboutique"}[1m])) > 0.3)
          for: 15s
          labels:
            severity: warning
            namespace: onlineboutique
          annotations:
            summary: "Pod {{ $labels.pod }} CPU usage exceeded 80% of limit or throttled."
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is consuming excessive CPU relative to its limit."

        # [Case 03] 메모리 한도 초과 / OOMKilled (cartservice Memory OOM 대응)
        - alert: ServiceContainerOOMKilled
          expr: (increase(container_oom_events_total{namespace="onlineboutique"}[2m]) > 0) or (kube_pod_container_status_last_terminated_reason{namespace="onlineboutique", reason="OOMKilled"} > 0)
          for: 5s
          labels:
            severity: critical
            namespace: onlineboutique
          annotations:
            summary: "Container {{ $labels.container }} in pod {{ $labels.pod }} was OOMKilled."
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} exceeded memory limits and terminated with OOMKilled."

        # [Case 03 & 04 공통] 파드 비정상 / CrashLoopBackOff 또는 Readiness 실패
        - alert: ServicePodNotHealthy
          expr: (kube_pod_status_phase{namespace="onlineboutique", phase=~"Failed|Pending|Unknown"} > 0) or (kube_pod_container_status_ready{namespace="onlineboutique"} == 0 and on(namespace, pod) kube_pod_status_phase{namespace="onlineboutique", phase="Running"} > 0)
          for: 15s
          labels:
            severity: critical
            namespace: onlineboutique
          annotations:
            summary: "Pod {{ $labels.pod }} is unhealthy or not ready."
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for over 15 seconds."

