apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-receiver
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: ALERT_RECEIVER_ROLE_ARN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-receiver
  template:
    metadata:
      labels:
        app: alert-receiver
    spec:
      serviceAccountName: alert-receiver
      containers:
        - name: receiver
          image: ALERT_RECEIVER_IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: RESULT_BUCKET
              value: ALERT_RESULTS_BUCKET
            - name: HOLMES_MODEL
              value: default-model
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: monitoring
spec:
  selector:
    app: alert-receiver
  ports:
    - port: 8080
      targetPort: 8080
