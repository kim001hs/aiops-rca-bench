name: "Terraform Apply"

on:
  workflow_dispatch: # GitHub Actions 웹/모바일에서 수동 버튼 클릭으로 실행

# OIDC 토큰 발급을 위한 필수 권한
permissions:
  id-token: write
  contents: read

# destroy 워크플로우와 같은 group을 사용하여 state 동시 변경 방지
concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  apply:
    name: "Terraform Apply (Dev Env)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: terraform/envs/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 필수 GitHub Secret 확인
      - name: Validate required secrets
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "${AWS_ROLE_ARN:-}" ]; then
            echo "Required GitHub Secret AWS_ROLE_ARN is not configured."
            exit 1
          fi

      # 2. AWS 자격 증명 설정 (OIDC 기반 - 보안 키 없이 임시 자격 증명 발급)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformApply
          aws-region: ap-northeast-2

      # 3. Terraform CLI 설치
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          # 셸 command substitution에서 terraform output 원문만 받도록 wrapper 비활성화
          terraform_wrapper: false

      # 4. kubectl CLI 설치 (클러스터 상태 점검용)
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.0"

      # 5. Helm CLI 설치 (애플리케이션 배포용)
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.0"

      # 6. 환경 변수 파일 준비 (gitignored 파일이므로 example 파일 복사)
      - name: Prepare terraform.tfvars
        run: |
          if [ ! -f terraform.tfvars ]; then
            cp terraform.tfvars.example terraform.tfvars
          fi

      # 7. S3 원격 백엔드 초기화
      - name: Terraform Init
        run: terraform init

      - name: Load persistent alert resources
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="$(aws ssm get-parameter --name /msa-demo/alert-results-bucket --query Parameter.Value --output text)"
          REPO="$(aws ssm get-parameter --name /msa-demo/alert-receiver-repository --query Parameter.Value --output text)"
          CART_REPO="$(aws ssm get-parameter --name /msa-demo/cartservice-benchmark-repository --query Parameter.Value --output text)"
          PAYMENT_REPO="$(aws ssm get-parameter --name /msa-demo/paymentservice-benchmark-repository --query Parameter.Value --output text)"
          PROBE_REPO="$(aws ssm get-parameter --name /msa-demo/order-probe-repository --query Parameter.Value --output text)"
          echo "TF_VAR_alert_results_bucket=$BUCKET" >> "$GITHUB_ENV"
          echo "RECEIVER_REPO=$REPO" >> "$GITHUB_ENV"
          echo "CART_REPO=$CART_REPO" >> "$GITHUB_ENV"
          echo "PAYMENT_REPO=$PAYMENT_REPO" >> "$GITHUB_ENV"
          echo "PROBE_REPO=$PROBE_REPO" >> "$GITHUB_ENV"
          echo "TF_VAR_alert_receiver_image=$REPO:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Prepare or build container images (ECR Cache Aware)
        shell: bash
        run: |
          set -euo pipefail

          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin "${RECEIVER_REPO%%/*}"

          ensure_ecr_image() {
            local REPO_URI="$1"
            local REPO_NAME="${REPO_URI##*/}"
            local CONTENT_HASH="$2"
            local GIT_SRC_PATH="$3"
            local BUILD_TYPE="$4"
            local BUILD_PATH="$5"
            local BUILD_CONTEXT="${6:-$BUILD_PATH}"

            local TREE_TAG="tree-${CONTENT_HASH:0:20}"

            echo "=================================================="
            echo "Checking ECR image for: $REPO_NAME"
            echo "Target tag      : $GITHUB_SHA"
            echo "Content tag     : $TREE_TAG"

            # 1. 대상 커밋 SHA 태그가 이미 ECR에 존재하는지 확인 (동일 커밋 재실행 등)
            if aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
              echo "✓ Image already exists in ECR: $REPO_NAME:$GITHUB_SHA (skipping build)"
              return 0
            fi

            # 2. 소스 코드 내용(Tree Hash)이 동일한 기존 이미지가 ECR에 있는지 확인
            local MANIFEST
            MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO_NAME" --image-ids imageTag="$TREE_TAG" --query 'images[0].imageManifest' --output text 2>/dev/null || true)

            # 2-1. Tree Tag가 없으면 소스의 마지막 커밋 SHA 태그가 ECR에 있는지 확인 (기존 빌드 이미지 재활용)
            if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
              local LAST_COMMIT
              LAST_COMMIT=$(git log -1 --format="%H" -- $GIT_SRC_PATH 2>/dev/null || true)
              if [ -n "$LAST_COMMIT" ] && [ "$LAST_COMMIT" != "$GITHUB_SHA" ]; then
                MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO_NAME" --image-ids imageTag="$LAST_COMMIT" --query 'images[0].imageManifest' --output text 2>/dev/null || true)
                if [ -n "$MANIFEST" ] && [ "$MANIFEST" != "None" ]; then
                  echo "✓ Found existing image from last modified commit $LAST_COMMIT in ECR."
                fi
              fi
            fi

            # 2-2. 기존 매니페스트가 있으면 ECR에서 0.5초 만에 신규 태그 매핑 후 종료 (빌드/다운로드 완전 생략)
            if [ -n "$MANIFEST" ] && [ "$MANIFEST" != "None" ]; then
              echo "✓ Source code unchanged. Fast-tagging in ECR: $REPO_NAME:$GITHUB_SHA & $TREE_TAG..."
              aws ecr put-image --repository-name "$REPO_NAME" --image-tag "$GITHUB_SHA" --image-manifest "$MANIFEST" >/dev/null
              aws ecr put-image --repository-name "$REPO_NAME" --image-tag "$TREE_TAG" --image-manifest "$MANIFEST" >/dev/null 2>&1 || true
              echo "✓ Successfully reused cached image in ECR."
              return 0
            fi

            # 3. 소스가 변경되었거나 ECR 캐시가 없는 경우: 신규 빌드 및 푸시
            echo "⚡ Source changed or cache missing. Building new image..."
            if [ "$BUILD_TYPE" = "dockerfile" ]; then
              docker build -f "$BUILD_PATH" -t "$REPO_URI:$GITHUB_SHA" -t "$REPO_URI:$TREE_TAG" "$BUILD_CONTEXT"
            else
              docker build -t "$REPO_URI:$GITHUB_SHA" -t "$REPO_URI:$TREE_TAG" "$BUILD_PATH"
            fi

            echo "Pushing images ($GITHUB_SHA, $TREE_TAG) to ECR..."
            docker push "$REPO_URI:$GITHUB_SHA"
            docker push "$REPO_URI:$TREE_TAG"
            echo "✓ Successfully built and pushed $REPO_NAME"
          }

          # 1. alert-receiver
          ALERT_HASH="$(git rev-parse HEAD:alert-receiver)"
          ensure_ecr_image "$RECEIVER_REPO" "$ALERT_HASH" "alert-receiver" "dir" "$GITHUB_WORKSPACE/alert-receiver"

          # 2. cartservice
          CART_HASH="$(git rev-parse HEAD:src/cartservice/src)"
          ensure_ecr_image "$CART_REPO" "$CART_HASH" "src/cartservice/src" "dir" "$GITHUB_WORKSPACE/src/cartservice/src"

          # 3. paymentservice
          PAYMENT_HASH="$(git rev-parse HEAD:src/paymentservice)"
          ensure_ecr_image "$PAYMENT_REPO" "$PAYMENT_HASH" "src/paymentservice" "dir" "$GITHUB_WORKSPACE/src/paymentservice"

          # 4. order-probe
          PROBE_HASH="$(git rev-parse HEAD:benchmark/probes/order-probe.Dockerfile HEAD:benchmark/probes/order_probe.py | git hash-object --stdin)"
          ensure_ecr_image "$PROBE_REPO" "$PROBE_HASH" "benchmark/probes/order-probe.Dockerfile benchmark/probes/order_probe.py" "dockerfile" "$GITHUB_WORKSPACE/benchmark/probes/order-probe.Dockerfile" "$GITHUB_WORKSPACE/benchmark/probes"

      # 8. EKS 클러스터 및 인프라 프로비저닝 (약 10~15분 소요)
      - name: Terraform Apply
        run: terraform apply -auto-approve -lock-timeout=10m

      # 9. Online Boutique 마이크로서비스 자동 배포
      - name: Deploy Online Boutique
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="$(terraform output -raw eks_cluster_name)"
          echo "Configuring kubectl for cluster: $CLUSTER_NAME"
          aws eks update-kubeconfig --region ap-northeast-2 --name "$CLUSTER_NAME"

          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo update
          helm upgrade --install tempo grafana-community/tempo --version 3.2.1 --namespace monitoring --create-namespace \
            --values "$GITHUB_WORKSPACE/monitoring/tempo-values.yaml"
          kubectl rollout status statefulset/tempo -n monitoring --timeout=180s

          echo "Deploying Online Boutique Helm chart..."
          CART_HELM_ARGS=()
          if kubectl get deployment cartservice -n onlineboutique >/dev/null 2>&1; then
            CART_MEMORY_REQUEST="$(kubectl get deployment cartservice -n onlineboutique -o jsonpath='{.spec.template.spec.containers[?(@.name=="server")].resources.requests.memory}')"
            CART_MEMORY_LIMIT="$(kubectl get deployment cartservice -n onlineboutique -o jsonpath='{.spec.template.spec.containers[?(@.name=="server")].resources.limits.memory}')"
            if [ -n "$CART_MEMORY_REQUEST" ] && [ -n "$CART_MEMORY_LIMIT" ]; then
              CART_HELM_ARGS+=(--set "cartService.resources.requests.memory=$CART_MEMORY_REQUEST")
              CART_HELM_ARGS+=(--set "cartService.resources.limits.memory=$CART_MEMORY_LIMIT")
            fi
          fi
          helm upgrade --install onlineboutique "$GITHUB_WORKSPACE/helm-chart" \
            --namespace onlineboutique \
            --create-namespace \
            --set-string "cartService.image=$CART_REPO:${GITHUB_SHA}" \
            --set-string "paymentService.image=$PAYMENT_REPO:${GITHUB_SHA}" \
            --set benchmarkTracing.enabled=true \
            "${CART_HELM_ARGS[@]}"
          kubectl rollout status deployment/opentelemetrycollector -n onlineboutique --timeout=180s

          ACTUAL_IMAGE="$(kubectl get deployment cartservice -n onlineboutique -o jsonpath='{.spec.template.spec.containers[?(@.name=="server")].image}')"
          if [ "$ACTUAL_IMAGE" != "$CART_REPO:${GITHUB_SHA}" ]; then
            echo "cartservice image mismatch: expected $CART_REPO:${GITHUB_SHA}, got $ACTUAL_IMAGE" >&2
            exit 1
          fi

          echo "Online Boutique deployment initiated successfully."

      # 10. Prometheus & Alertmanager 모니터링 스택 배포
      - name: Deploy Monitoring Stack (kube-prometheus-stack)
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="$(terraform output -raw eks_cluster_name)"
          aws eks update-kubeconfig --region ap-northeast-2 --name "$CLUSTER_NAME"

          echo "Adding Prometheus Helm repository..."
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          echo "Deploying kube-prometheus-stack..."
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --version 92.17.0 \
            --namespace monitoring \
            --create-namespace \
            --values "$GITHUB_WORKSPACE/monitoring/prometheus-values.yaml"

          sed "s|ORDER_PROBE_IMAGE|$PROBE_REPO:${GITHUB_SHA}|g" \
            "$GITHUB_WORKSPACE/monitoring/order-probe.yaml" | kubectl apply -f -
          kubectl rollout status deployment/order-probe -n monitoring --timeout=180s

          echo "Applying Benchmark Fast Alert Rules (Cases 01~04)..."
          kubectl apply -f "$GITHUB_WORKSPACE/monitoring/benchmark-rules.yaml"

          ACTUAL_RULE="$(kubectl get prometheusrule benchmark-fast-alerts -n monitoring -o jsonpath='{.spec.groups[*].rules[?(@.alert=="ServicePodNotHealthy")].expr}')"
          if [[ "$ACTUAL_RULE" != *'and on(namespace, pod)'* ]]; then
            echo "ServicePodNotHealthy is missing the namespace/pod vector match" >&2
            exit 1
          fi

          echo "Monitoring stack and benchmark alert rules deployed successfully."

      # 11. HolmesGPT 자율 조사 에이전트 배포
      - name: Deploy HolmesGPT Agent
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          CLUSTER_NAME="$(terraform output -raw eks_cluster_name)"
          aws eks update-kubeconfig --region ap-northeast-2 --name "$CLUSTER_NAME"

          echo "Creating holmes-secrets in namespace monitoring..."
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic holmes-secrets \
            --namespace monitoring \
            --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
            --from-literal=GEMINI_API_KEY="${GEMINI_API_KEY:-}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Adding Robusta Helm repository..."
          helm repo add robusta https://robusta-charts.storage.googleapis.com
          helm repo update

          echo "Deploying Holmes..."
          helm upgrade --install holmes robusta/holmes \
            --version 0.45.0 \
            --namespace monitoring \
            --values "$GITHUB_WORKSPACE/monitoring/holmes-values.yaml" \
            --values "$GITHUB_WORKSPACE/monitoring/holmes-tempo-disabled.yaml"

          echo "Holmes deployed successfully."

      - name: Deploy alert receiver
        shell: bash
        run: |
          set -euo pipefail
          ROLE_ARN="$(terraform output -raw alert_receiver_role_arn)"
          BUCKET="$(terraform output -raw alert_results_bucket)"
          IMAGE="$(terraform output -raw alert_receiver_image)"
          sed -e "s|ALERT_RECEIVER_ROLE_ARN|$ROLE_ARN|g" \
              -e "s|ALERT_RESULTS_BUCKET|$BUCKET|g" \
              -e "s|ALERT_RECEIVER_IMAGE|$IMAGE|g" \
              "$GITHUB_WORKSPACE/monitoring/alert-receiver.yaml" | kubectl apply -f -
          kubectl rollout status deployment/alert-receiver -n monitoring --timeout=180s

      # 12. 클러스터 상태 검증 및 Step Summary 작성
      - name: Output Connection Guide & Summary
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="$(terraform output -raw eks_cluster_name)"
          KUBECONFIG_CMD="$(terraform output -raw configure_kubectl)"
          ENDPOINT="$(terraform output -raw eks_cluster_endpoint)"

          echo "Configuring kubectl for cluster: $CLUSTER_NAME"
          aws eks update-kubeconfig --region ap-northeast-2 --name "$CLUSTER_NAME"

          echo "Checking worker nodes status..."
          NODES_OUTPUT="$(kubectl get nodes -o wide 2>&1 || echo 'Node lookup skipped')"

          echo "Checking onlineboutique pods status..."
          PODS_OUTPUT="$(kubectl get pods -n onlineboutique -o wide 2>&1 || echo 'Pod lookup skipped')"

          echo "Checking monitoring & holmes pods status..."
          MONITORING_OUTPUT="$(kubectl get pods -n monitoring -o wide 2>&1 || echo 'Monitoring lookup skipped')"

          {
            echo "## 🚀 AWS EKS, Online Boutique, Prometheus & HolmesGPT 배포 완료!"
            echo ""
            echo "클러스터 프로비저닝, Online Boutique MSA, Prometheus/Alertmanager 모니터링, HolmesGPT 자율 진단 에이전트 배포가 성공적으로 완료되었습니다."
            echo ""
            echo "### 📌 클러스터 연결 정보"
            echo "- **클러스터명:** \`$CLUSTER_NAME\`"
            echo "- **API 서버 엔드포인트:** \`$ENDPOINT\`"
            echo "- **로컬 PC 접속 명령어:**"
            echo '```bash'
            echo "$KUBECONFIG_CMD"
            echo "kubectl get nodes"
            echo "kubectl get pods -n onlineboutique"
            echo "kubectl get pods -n monitoring"
            echo '```'
            echo ""
            echo "### 🖥️ 워커 노드 상태"
            echo '```text'
            echo "$NODES_OUTPUT"
            echo '```'
            echo ""
            echo "### 🛍️ Online Boutique 파드 상태"
            echo '```text'
            echo "$PODS_OUTPUT"
            echo '```'
            echo ""
            echo "### 📊 Monitoring & HolmesGPT 파드 상태"
            echo '```text'
            echo "$MONITORING_OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
