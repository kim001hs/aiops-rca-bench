name: "Terraform Apply"

on:
  workflow_dispatch: # GitHub Actions 웹/모바일에서 수동 버튼 클릭으로 실행

# OIDC 토큰 발급을 위한 필수 권한
permissions:
  id-token: write
  contents: read

# destroy 워크플로우와 같은 group을 사용하여 state 동시 변경 방지
concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  apply:
    name: "Terraform Apply (Dev Env)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: terraform/envs/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 필수 GitHub Secret 확인
      - name: Validate required secrets
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "${AWS_ROLE_ARN:-}" ]; then
            echo "Required GitHub Secret AWS_ROLE_ARN is not configured."
            exit 1
          fi

      # 2. AWS 자격 증명 설정 (OIDC 기반 - 보안 키 없이 임시 자격 증명 발급)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformApply
          aws-region: ap-northeast-2

      # 3. Terraform CLI 설치
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          # 셸 command substitution에서 terraform output 원문만 받도록 wrapper 비활성화
          terraform_wrapper: false

      # 4. kubectl CLI 설치 (클러스터 상태 점검용)
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.0"

      # 5. Helm CLI 설치 (애플리케이션 배포용)
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.0"

      # 6. 환경 변수 파일 준비 (gitignored 파일이므로 example 파일 복사)
      - name: Prepare terraform.tfvars
        run: |
          if [ ! -f terraform.tfvars ]; then
            cp terraform.tfvars.example terraform.tfvars
          fi

      # 7. S3 원격 백엔드 초기화
      - name: Terraform Init
        run: terraform init

      # 8. EKS 클러스터 및 인프라 프로비저닝 (약 10~15분 소요)
      - name: Terraform Apply
        run: terraform apply -auto-approve -lock-timeout=10m

      # 9. Online Boutique 마이크로서비스 자동 배포
      - name: Deploy Online Boutique
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="$(terraform output -raw eks_cluster_name)"
          echo "Configuring kubectl for cluster: $CLUSTER_NAME"
          aws eks update-kubeconfig --region ap-northeast-2 --name "$CLUSTER_NAME"

          echo "Deploying Online Boutique Helm chart..."
          helm upgrade --install onlineboutique "$GITHUB_WORKSPACE/helm-chart" \
            --namespace onlineboutique \
            --create-namespace

          echo "Online Boutique deployment initiated successfully."

      # 10. Prometheus & Alertmanager 모니터링 스택 배포
      - name: Deploy Monitoring Stack (kube-prometheus-stack)
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="$(terraform output -raw eks_cluster_name)"
          aws eks update-kubeconfig --region ap-northeast-2 --name "$CLUSTER_NAME"

          echo "Adding Prometheus Helm repository..."
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          echo "Deploying kube-prometheus-stack..."
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --values "$GITHUB_WORKSPACE/monitoring/prometheus-values.yaml"

          echo "Monitoring stack deployed successfully."

      # 11. HolmesGPT 자율 조사 에이전트 배포
      - name: Deploy HolmesGPT Agent
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          CLUSTER_NAME="$(terraform output -raw eks_cluster_name)"
          aws eks update-kubeconfig --region ap-northeast-2 --name "$CLUSTER_NAME"

          echo "Creating holmes-secrets in namespace monitoring..."
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic holmes-secrets \
            --namespace monitoring \
            --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Adding Robusta Helm repository..."
          helm repo add robusta https://robusta-charts.storage.googleapis.com
          helm repo update

          echo "Deploying HolmesGPT..."
          helm upgrade --install holmes robusta/holmes \
            --namespace monitoring \
            --values "$GITHUB_WORKSPACE/monitoring/holmes-values.yaml"

          echo "HolmesGPT deployed successfully."

      # 12. 클러스터 상태 검증 및 Step Summary 작성
      - name: Output Connection Guide & Summary
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_NAME="$(terraform output -raw eks_cluster_name)"
          KUBECONFIG_CMD="$(terraform output -raw configure_kubectl)"
          ENDPOINT="$(terraform output -raw eks_cluster_endpoint)"

          echo "Configuring kubectl for cluster: $CLUSTER_NAME"
          aws eks update-kubeconfig --region ap-northeast-2 --name "$CLUSTER_NAME"

          echo "Checking worker nodes status..."
          NODES_OUTPUT="$(kubectl get nodes -o wide 2>&1 || echo 'Node lookup skipped')"

          echo "Checking onlineboutique pods status..."
          PODS_OUTPUT="$(kubectl get pods -n onlineboutique -o wide 2>&1 || echo 'Pod lookup skipped')"

          echo "Checking monitoring & holmes pods status..."
          MONITORING_OUTPUT="$(kubectl get pods -n monitoring -o wide 2>&1 || echo 'Monitoring lookup skipped')"

          {
            echo "## 🚀 AWS EKS, Online Boutique, Prometheus & HolmesGPT 배포 완료!"
            echo ""
            echo "클러스터 프로비저닝, Online Boutique MSA, Prometheus/Alertmanager 모니터링, HolmesGPT 자율 진단 에이전트 배포가 성공적으로 완료되었습니다."
            echo ""
            echo "### 📌 클러스터 연결 정보"
            echo "- **클러스터명:** \`$CLUSTER_NAME\`"
            echo "- **API 서버 엔드포인트:** \`$ENDPOINT\`"
            echo "- **로컬 PC 접속 명령어:**"
            echo '```bash'
            echo "$KUBECONFIG_CMD"
            echo "kubectl get nodes"
            echo "kubectl get pods -n onlineboutique"
            echo "kubectl get pods -n monitoring"
            echo '```'
            echo ""
            echo "### 🖥️ 워커 노드 상태"
            echo '```text'
            echo "$NODES_OUTPUT"
            echo '```'
            echo ""
            echo "### 🛍️ Online Boutique 파드 상태"
            echo '```text'
            echo "$PODS_OUTPUT"
            echo '```'
            echo ""
            echo "### 📊 Monitoring & HolmesGPT 파드 상태"
            echo '```text'
            echo "$MONITORING_OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
