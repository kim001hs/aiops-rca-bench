name: "Terraform Destroy"

on:
  workflow_dispatch: # GitHub Actions 웹/모바일에서 수동 버튼 클릭으로 실행

# OIDC 토큰 발급을 위한 필수 권한
permissions:
  id-token: write
  contents: read

# apply 워크플로우 추가 시에도 같은 group을 사용하여 state 동시 변경 방지
concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  destroy:
    name: "Terraform Destroy (Dev Env)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: terraform/envs/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 필수 GitHub Secret 확인
      - name: Validate required secrets
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "${AWS_ROLE_ARN:-}" ]; then
            echo "Required GitHub Secret AWS_ROLE_ARN is not configured."
            exit 1
          fi

      # 2. AWS 자격 증명 설정 (OIDC 기반 - 보안 키 없이 임시 자격 증명 발급)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformDestroy
          aws-region: ap-northeast-2

      # 3. Terraform CLI 설치
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          # 셸 command substitution에서 terraform output 원문만 받도록 wrapper 비활성화
          terraform_wrapper: false

      # 4. Kubernetes LoadBalancer를 EKS보다 먼저 정리하기 위한 kubectl 설치
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.0"

      # 5. 환경 변수 파일 준비 (gitignored 파일이므로 example 파일 복사)
      - name: Prepare terraform.tfvars
        run: |
          if [ ! -f terraform.tfvars ]; then
            cp terraform.tfvars.example terraform.tfvars
          fi

      # 6. S3 원격 백엔드 초기화
      - name: Terraform Init
        run: terraform init

      - name: Load persistent alert resources
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="$(aws ssm get-parameter --name /msa-demo/alert-results-bucket --query Parameter.Value --output text)"
          REPO="$(aws ssm get-parameter --name /msa-demo/alert-receiver-repository --query Parameter.Value --output text)"
          echo "TF_VAR_alert_results_bucket=$BUCKET" >> "$GITHUB_ENV"
          echo "TF_VAR_alert_receiver_image=$REPO:latest" >> "$GITHUB_ENV"

      # 7. Kubernetes가 생성한 AWS ELB/ENI/보안 그룹을 EKS 삭제 전에 정리
      - name: Delete Kubernetes LoadBalancer Services
        shell: bash
        run: |
          set -euo pipefail

          # state가 이미 부분 삭제되어 output이 없어도 tfvars의 클러스터명을 사용한다.
          # runner에서 console 경고가 함께 출력되더라도 유효한 quoted 값 행만 추출한다.
          CLUSTER_NAME="$(
            terraform console -no-color <<< 'var.cluster_name' |
              sed -nE 's/^"([A-Za-z0-9][A-Za-z0-9_-]{0,99})"$/\1/p' |
              tail -n 1
          )"

          if [[ ! "$CLUSTER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$ ]]; then
            echo "Failed to resolve a valid EKS cluster name from Terraform variables." >&2
            exit 1
          fi

          if ! EKS_STATUS="$(
            aws eks describe-cluster \
              --region ap-northeast-2 \
              --name "$CLUSTER_NAME" \
              --query 'cluster.status' \
              --output text 2>&1
          )"; then
            if [[ "$EKS_STATUS" != *"ResourceNotFoundException"* ]]; then
              echo "Failed to query EKS cluster '$CLUSTER_NAME'." >&2
              echo "$EKS_STATUS" >&2
              exit 1
            fi

            echo "EKS cluster '$CLUSTER_NAME' does not exist. Checking for orphaned load balancers."
            ORPHANED_LOAD_BALANCERS=()

            CLASSIC_LOAD_BALANCERS="$(
              aws elb describe-load-balancers \
                --region ap-northeast-2 \
                --query 'LoadBalancerDescriptions[].LoadBalancerName' \
                --output text
            )"

            for load_balancer in ${CLASSIC_LOAD_BALANCERS//$'\t'/ }; do
              if [ -z "$load_balancer" ] || [ "$load_balancer" = "None" ]; then
                continue
              fi
              cluster_tag="$(
                aws elb describe-tags \
                  --region ap-northeast-2 \
                  --load-balancer-names "$load_balancer" \
                  --query "TagDescriptions[0].Tags[?Key=='kubernetes.io/cluster/${CLUSTER_NAME}'].Value | [0]" \
                  --output text
              )"
              if [ "$cluster_tag" = "owned" ] || [ "$cluster_tag" = "shared" ]; then
                ORPHANED_LOAD_BALANCERS+=("classic/$load_balancer")
              fi
            done

            LOAD_BALANCER_ARNS="$(
              aws elbv2 describe-load-balancers \
                --region ap-northeast-2 \
                --query 'LoadBalancers[].LoadBalancerArn' \
                --output text
            )"

            for load_balancer_arn in ${LOAD_BALANCER_ARNS//$'\t'/ }; do
              if [ -z "$load_balancer_arn" ] || [ "$load_balancer_arn" = "None" ]; then
                continue
              fi
              cluster_tag="$(
                aws elbv2 describe-tags \
                  --region ap-northeast-2 \
                  --resource-arns "$load_balancer_arn" \
                  --query "TagDescriptions[0].Tags[?Key=='kubernetes.io/cluster/${CLUSTER_NAME}'].Value | [0]" \
                  --output text
              )"
              if [ "$cluster_tag" = "owned" ] || [ "$cluster_tag" = "shared" ]; then
                ORPHANED_LOAD_BALANCERS+=("v2/$load_balancer_arn")
              fi
            done

            if [ "${#ORPHANED_LOAD_BALANCERS[@]}" -gt 0 ]; then
              echo "Orphaned Kubernetes load balancers detected:" >&2
              printf '  - %s\n' "${ORPHANED_LOAD_BALANCERS[@]}" >&2
              echo "Stopping before terraform destroy. Remove the tagged owner resources through the recovery procedure." >&2
              exit 1
            fi

            echo "No load balancers tagged for '$CLUSTER_NAME' were found; continuing terraform destroy."
            exit 0
          fi

          echo "EKS cluster '$CLUSTER_NAME' status: $EKS_STATUS"

          aws eks update-kubeconfig \
            --region ap-northeast-2 \
            --name "$CLUSTER_NAME"

          if [ "$(kubectl auth can-i delete services --all-namespaces)" != "yes" ]; then
            echo "GitHub Actions role cannot delete Kubernetes Services."
            echo "Stopping before terraform destroy to avoid orphaning AWS load balancers."
            exit 1
          fi

          LOAD_BALANCER_SERVICES="$(
            kubectl get services --all-namespaces \
              -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}'
          )"

          if [ -z "$LOAD_BALANCER_SERVICES" ]; then
            echo "No Kubernetes LoadBalancer Services found."
            exit 0
          fi

          while read -r namespace service; do
            [ -z "$service" ] && continue
            echo "Deleting LoadBalancer Service: $namespace/$service"
            kubectl delete service "$service" \
              --namespace "$namespace" \
              --wait=true \
              --timeout=10m
          done <<< "$LOAD_BALANCER_SERVICES"

      # 8. EKS 및 인프라 전체 자동 삭제 (과금 방어)
      - name: Terraform Destroy
        run: terraform destroy -auto-approve -lock-timeout=10m
